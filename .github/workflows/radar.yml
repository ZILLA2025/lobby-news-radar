# Lobby News Radar in the cloud: one check every ~5 minutes on GitHub's computers.
# Secrets (Settings > Secrets and variables > Actions): TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID,
# and optionally ANTHROPIC_API_KEY. Never put them in this file.
name: Lobby News Radar

on:
  schedule:
    - cron: "2-59/5 * * * *"  # every 5 min at :02, :07, ... (off the busy round minutes; GitHub can still be late)
    - cron: "17 3 * * 1"    # weekly keep-alive (Monday 08:47 IST), see the keepalive job
  workflow_dispatch:
    inputs:
      mode:
        description: "once (normal check) or reel-test (make a test news Reel, preview only)"
        default: "once"

permissions:
  contents: read

# Only one check at a time, so radar.db (the list of seen items) is never overwritten by an older copy.
# A reel-test has its own queue (so scheduled checks can't cancel it) and never saves radar.db.
concurrency:
  group: radar${{ github.event.inputs.mode == 'reel-test' && '-test' || '' }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20   # making + hosting a Reel takes a few minutes
    permissions:
      contents: write   # only to put pictures for scheduled posts on the "media" branch
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # The owner's official stills (private repo, read-only deploy key). If the key isn't set up,
      # cards simply fall back to text-only and the radar keeps running.
      - name: Official assets (private)
        continue-on-error: true
        uses: actions/checkout@v5
        with:
          repository: ZILLA2025/lobby-assets
          ssh-key: ${{ secrets.ASSETS_DEPLOY_KEY }}
          path: assets/Official

      # ffmpeg: a static build from FFmpeg-Builds/FFmpeg-Builds (formerly BtbN) kept in the Actions cache
      # (owner OK'd on 2026-11-19; apt-get took 6-12 min on some runs and delayed posts).
      # Falls back to apt if the download fails.
      - name: Cached ffmpeg
        uses: actions/cache@v4
        with:
          path: ~/ffmpeg-bin
          key: ffmpeg-static-n8.1-v1

      - name: ffmpeg for Reels
        run: |
          if [ ! -x ~/ffmpeg-bin/ffmpeg ]; then
            mkdir -p ~/ffmpeg-bin
            curl -fsSL --retry 3 --max-time 180 \
              https://github.com/FFmpeg-Builds/FFmpeg-Builds/releases/download/latest/ffmpeg-n8.1-latest-linux64-gpl-8.1.tar.xz \
              | tar -xJ -C ~/ffmpeg-bin --strip-components=2 --wildcards '*/bin/ffmpeg' '*/bin/ffprobe' || true
          fi
          if [ -x ~/ffmpeg-bin/ffmpeg ] && ~/ffmpeg-bin/ffmpeg -version >/dev/null 2>&1; then
            echo "$HOME/ffmpeg-bin" >> "$GITHUB_PATH"
            ~/ffmpeg-bin/ffmpeg -version | head -1
          else
            rm -rf ~/ffmpeg-bin
            command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
          fi

      - name: Bold font for the cards
        run: |
          test -f /usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf || \
            (sudo apt-get update -qq && sudo apt-get install -y -qq fonts-dejavu-core)

      - name: Restore seen items
        uses: actions/cache/restore@v4
        with:
          path: radar.db
          key: radar-db-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: radar-db-

      - name: Check sources
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          MODE: ${{ github.event.inputs.mode }}
          LISTEN_SECONDS: "200"   # after the check, answer Telegram buttons instantly until the next check
        # only two allowed values - the input never reaches the shell as code
        run: |
          if [ "$MODE" = "reel-test" ]; then python radar.py --reel-test; else python radar.py --once; fi

      - name: Save seen items
        if: always() && github.event.inputs.mode != 'reel-test'
        uses: actions/cache/save@v4
        with:
          path: radar.db
          key: radar-db-${{ github.run_id }}-${{ github.run_attempt }}

      # Full-quality card.png / story.png / caption.txt, downloadable from the run page for 3 days.
      - name: Keep drafts
        if: always() && hashFiles('drafts/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: drafts-${{ github.run_id }}
          # our cards only - not the copies of official stills (this repo and its artifacts are public)
          path: |
            drafts/
            !drafts/**/source_image.jpg
          retention-days: 3

  # GitHub pauses scheduled workflows in public repos after 60 days without a commit.
  # Re-enabling the workflow once a week resets that timer.
  keepalive:
    if: github.event.schedule == '17 3 * * 1'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/radar.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}
